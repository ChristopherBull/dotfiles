name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Scripts & configs
    # 1-core runner at a third of the 2-core rate ($0.002 vs $0.006 a
    # minute), so it's cheaper as long as the job bills under 3 minutes.
    # Single-CPU jobs are capped at 15 minutes.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts (shellcheck)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          echo "Validating ${#files[@]} shell script(s)..."
          printf '%s\0' "${files[@]}" | xargs -0 shellcheck

      # Same job, not a Windows runner. The slim image ships pwsh but not
      # PSScriptAnalyzer, so it's installed from PSGallery when missing. The
      # settings file adds Windows PowerShell 5.1 compatibility checks.
      - name: PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $files = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          Write-Output "Validating $($files.Count) PowerShell file(s)..."
          $findings = @($files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1
          })
          if ($findings.Count -gt 0) {
            $findings | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap |
              Out-String -Width 200 | Write-Output
            exit 1
          }

      - name: JSON (jq)
        run: |
          mapfile -t files < <(git ls-files '*.json')
          echo "Validating ${#files[@]} JSON file(s)..."
          printf '%s\0' "${files[@]}" | xargs -0 jq empty

      - name: YAML (PyYAML)
        run: |
          # The slim image has python3 but not PyYAML.
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3-yaml
          fi
          mapfile -t files < <(git ls-files '*.yml' '*.yaml')
          echo "Validating ${#files[@]} YAML file(s)..."
          for file in "${files[@]}"; do
            python3 -c "import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$file"
          done
